<VirtualHost *:80>
    ServerName taskflow.local
    DocumentRoot /var/www/taskflow

    <Directory /var/www/taskflow>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/taskflow/admin>
        AuthType Basic
        AuthName "Administracion de TaskFlow"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/.htpasswd
        Require user admin
    </Directory>

    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/taskflow-error.log
    CustomLog ${APACHE_LOG_DIR}/taskflow-access.log combined
</VirtualHost>
