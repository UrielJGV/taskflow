<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/localhost

    <Directory /var/www/localhost>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/localhost-error.log
    CustomLog ${APACHE_LOG_DIR}/localhost-access.log combined
</VirtualHost>
